<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Super Admin Recovery | OpportunityTrack</title><link rel="stylesheet" href="assets/css/admin.css"></head><body><main class="admin-auth-page"><section class="auth-art"><div class="logo"><span class="mark">O</span>OpportunityTrack</div><h1>Recover Super Admin access securely.</h1><p>Use the recovery key you saved during first-time setup. Resetting the password also signs out old Super Admin sessions.</p></section><section class="auth-panel"><div class="auth-card"><h2>Super Admin recovery</h2><p class="sub">Enter your username, recovery key and a new password.</p><div class="message" data-message></div><form data-recover-form><div class="field"><label>Super Admin username</label><input name="username" required></div><div class="field"><label>Recovery key</label><input name="recoveryKey" type="password" required></div><div class="field"><label>New password</label><input name="newPassword" type="password" minlength="10" required></div><button class="primary-btn full-btn" type="submit">Reset password</button></form><a class="back-link" href="admin-login.html">Back to login</a></div></section></main><script src="assets/js/admin-recover.js" defer></script></body></html>
